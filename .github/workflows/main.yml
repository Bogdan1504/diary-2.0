name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 23/' android/variables.gradle
          sed -i 's#</application>#<meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/></application>#' android/app/src/main/AndroidManifest.xml
          grep -n "minSdkVersion" android/variables.gradle
          grep -n "barcode_ui" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: reading-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
